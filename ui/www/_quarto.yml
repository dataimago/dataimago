project:
  type: website
  title: "dataimago: An AI-Native Application Development Framework for Data Science"
  output-dir: ../../docs
  render:
   - "*.qmd"      # Render all .qmd files by default
   - "!content/presentations/**"  # Exclude presentations directory
   - "content/documents/**"       # Include documents directory

execute:
  freeze: auto

# Extensions configuration
extensions:
  - dataimago/ai-native

# Filters configuration
filters:
  - svg-inline

# Define your package documentation
references:
  - type: r
    title: "Function Reference"
    source: "../../man"   # Path to your R package .Rd files (relative to ui/www)

website:
  site-url: "https://dataimago.github.io/dataimago/"
  repo-url: "https://github.com/dataimago/dataimago"
  title: "dataimago: Ethical AI-Native Data Science Foundation Package"
  description: "An emancipatory AI-aligned performance management system built on flow-based analytics and critical theory principles"
  favicon: /assets/img/ai_monogram_supreme_favicon.png
  repo-actions: none
  page-navigation: false
  bread-crumbs: false

  navbar:
    title: "dataimago"
    logo: /assets/img/ai_monogram.svg
    logo-alt: "dataimago AI-Native Data Science"
    logo-href: "https://dataimago.github.io/dataimago/"
    title-href: "https://dataimago.github.io/dataimago/"
    search: false
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: r_package.qmd
        text: R Package
      - text: Foundation
        menu:
          - href: mission.qmd
            text: Mission & Vision
          - href: philosophy.qmd
            text: Philosophy
          - href: critical_theory_manifesto.qmd
            text: Critical Theory Manifesto
    right:
      - text: "<img src='/assets/img/github_logo.svg' class='navbar-github-logo' title='GitHub' alt='GitHub' style='height:32px; vertical-align:middle; padding-right: 2px; margin-top: 0px;'/>"
        menu:
          - href: "https://github.com/dataimago/dataimago"
            text: Source Code
          - href: "https://github.com/dataimago/dataimago/issues"
            text: Report a Bug
          - href: "https://github.com/dataimago/dataimago/discussions"
            text: Request a Feature
        target: _blank

  sidebar:
    style: "docked"
    search: true
    contents:
       - section: "Getting Started"
         contents:
           - r_package.qmd
       - section: "Foundation"
         contents:
           - mission.qmd
           - philosophy.qmd
           - critical_theory_manifesto.qmd

  page-footer:
    left:
      - text: "<img src='/assets/img/quarto_logo.svg' class='footer-quarto-logo inline-svg' title='quarto.org' alt='quarto.org' style='width:28px; height:28px; vertical-align:middle; padding-right: 4px; margin-top: 6px;'/>" 
        href: https://quarto.org/
        target: _blank
      - text: "<img src='/assets/img/netlify_logo.svg' class='footer-netlify-logo' title='netlify.com' alt='netlify.com' style='height:28px; vertical-align:middle; padding-right: 4px; margin-top: 6px;'/>" 
        href: https://www.netlify.com/
        target: _blank
    center:
      - text: "<img src='/assets/img/ai_monogram.svg' class='footer-ai-monogram-logo' title='dataimago.ai' alt='dataimago.ai' style='height:28px; vertical-align:middle; padding-right: 4px; margin-top: 6px;'/>" 
        href: https://dataimago.ai/
        target: _blank
      - text: "<img src='/assets/img/package_hex_logo.svg' class='footer-package-hex-logo' title='dataimago R Package' alt='dataimago R Package' style='height: 32px; margin-top: 3px;'/>"
        href: https://dataimago.github.io/dataimago/
      - text: "<img src='/assets/img/bluesky_logo.svg' class='footer-bluesky-logo' title='Bluesky' style='height: 28px; margin-top: 5px;' alt='Bluesky'/>"
        href: https://bsky.app/intent/compose?text=dataimago%20%28R%20package%29%3A%20An%20AI-native%20application%20development%20framework%20for%20data%20science.%20%23dataimago%20%23rstats%20https%3A%2F%2Fdataimago.github.io%2Fdataimago
        target: _blank 

metadata:
  image: /assets/img/ai_monogram_supreme_COLOR.png  # must be a valid URL or relative path
  open-graph: true
  twitter-card:
    image: /assets/img/ai_monogram_supreme_COLOR.png
    card-style: summary_large_image

format:
  html:
    theme:
      light: _extensions/dataimago/ai-native/assets/css/website-light.scss
      dark: _extensions/dataimago/ai-native/assets/css/website-dark.scss
    css:
      - assets/css/tokens.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    include-after: |
      <meta name="dataimago-skip-links" content="false">
      <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,600" rel="stylesheet" type="text/css">
      <script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>
      <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
      <script type="text/javascript" src="/assets/js/jquery.sticky-kit.min.js"></script>
      <script type="text/javascript" src="/assets/js/lenis-integration.js"></script>
      <!-- Logo hover effects now handled by CSS -->
      <script type="text/javascript" src="/assets/js/custom-anchors.js"></script>
      <script type="text/javascript" src="/assets/js/accessibility.js"></script>