<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Futura', sans-serif; font-style: italic; font-weight: bold; font-size: 26px; fill: #333; }
      .section-title { font-family: 'Futura', sans-serif; font-weight: bold; font-size: 18px; fill: #333; }
      .thinker-name { font-family: 'Futura', sans-serif; font-weight: bold; font-size: 14px; fill: white; }
      .concept { font-family: 'Futura', sans-serif; font-size: 12px; fill: white; }
      .description { font-family: 'Futura', sans-serif; font-size: 10px; fill: #666; }
      .application { font-family: 'Futura', sans-serif; font-size: 11px; fill: #333; }
      
      .horkheimer-adorno { fill: #CC4125; stroke: #A0321C; stroke-width: 2; }
      .habermas { fill: #2E86AB; stroke: #1E5A78; stroke-width: 2; }
      .marcuse { fill: #A23B72; stroke: #7A2B55; stroke-width: 2; }
      .contemporary { fill: #F18F01; stroke: #C07001; stroke-width: 2; }
      .dataimago-response { fill: #4CAF50; stroke: #388E3C; stroke-width: 2; }
      
      .connection { fill: none; stroke: #F18F01; stroke-width: 2; marker-end: url(#arrowhead); }
      .influence { fill: none; stroke: #666; stroke-width: 1; stroke-dasharray: 3,3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F18F01" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" class="title">Frankfurt School → AI Framework</text>
  <text x="500" y="60" text-anchor="middle" class="description">Critical Theory Principles Applied to dataimago's AI Development</text>

  <!-- Horkheimer & Adorno Section -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="280" height="140" rx="10" class="horkheimer-adorno"/>
    <text x="140" y="25" text-anchor="middle" class="thinker-name">HORKHEIMER &amp; ADORNO</text>
    <text x="140" y="45" text-anchor="middle" class="concept">Dialectic of Enlightenment (1944)</text>
    
    <text x="10" y="70" class="concept">KEY INSIGHTS:</text>
    <text x="10" y="85" class="concept">• Instrumental reason → domination</text>
    <text x="10" y="100" class="concept">• "Culture industry" standardization</text>
    <text x="10" y="115" class="concept">• Reason without ethics = control</text>
    <text x="10" y="130" class="concept">• Need for critical consciousness</text>
  </g>

  <!-- Habermas Section -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="280" height="140" rx="10" class="habermas"/>
    <text x="140" y="25" text-anchor="middle" class="thinker-name">JÜRGEN HABERMAS</text>
    <text x="140" y="45" text-anchor="middle" class="concept">Communicative Rationality</text>
    
    <text x="10" y="70" class="concept">KEY INSIGHTS:</text>
    <text x="10" y="85" class="concept">• Democratic deliberation essential</text>
    <text x="10" y="100" class="concept">• Public sphere for rational discourse</text>
    <text x="10" y="115" class="concept">• Intersubjective truth-seeking</text>
    <text x="10" y="130" class="concept">• Legitimacy through participation</text>
  </g>

  <!-- Marcuse Section -->
  <g transform="translate(670, 100)">
    <rect x="0" y="0" width="280" height="140" rx="10" class="marcuse"/>
    <text x="140" y="25" text-anchor="middle" class="thinker-name">HERBERT MARCUSE</text>
    <text x="140" y="45" text-anchor="middle" class="concept">One-Dimensional Thought</text>
    
    <text x="10" y="70" class="concept">KEY INSIGHTS:</text>
    <text x="10" y="85" class="concept">• Technology can liberate or oppress</text>
    <text x="10" y="100" class="concept">• "Great Refusal" of false needs</text>
    <text x="10" y="115" class="concept">• Aesthetic dimension preserves utopia</text>
    <text x="10" y="130" class="concept">• Need for radical transformation</text>
  </g>

  <!-- Contemporary AI Problems -->
  <g transform="translate(50, 280)">
    <text x="450" y="20" text-anchor="middle" class="section-title">CONTEMPORARY AI PROBLEMS</text>
    
    <!-- Surveillance Capitalism -->
    <rect x="0" y="40" width="200" height="100" rx="8" class="contemporary"/>
    <text x="100" y="65" text-anchor="middle" class="thinker-name">SURVEILLANCE</text>
    <text x="100" y="80" text-anchor="middle" class="thinker-name">CAPITALISM</text>
    <text x="10" y="100" class="concept">• Data extraction for profit</text>
    <text x="10" y="115" class="concept">• Behavioral manipulation</text>
    <text x="10" y="130" class="concept">• Democratic erosion</text>
    
    <!-- Algorithmic Bias -->
    <rect x="220" y="40" width="200" height="100" rx="8" class="contemporary"/>
    <text x="320" y="65" text-anchor="middle" class="thinker-name">ALGORITHMIC</text>
    <text x="320" y="80" text-anchor="middle" class="thinker-name">BIAS</text>
    <text x="230" y="100" class="concept">• Systemic discrimination</text>
    <text x="230" y="115" class="concept">• Power amplification</text>
    <text x="230" y="130" class="concept">• Lack of accountability</text>
    
    <!-- AI Alignment Crisis -->
    <rect x="440" y="40" width="200" height="100" rx="8" class="contemporary"/>
    <text x="540" y="65" text-anchor="middle" class="thinker-name">ALIGNMENT</text>
    <text x="540" y="80" text-anchor="middle" class="thinker-name">CRISIS</text>
    <text x="450" y="100" class="concept">• Whose values to align with?</text>
    <text x="450" y="115" class="concept">• Technical vs. social challenges</text>
    <text x="450" y="130" class="concept">• Democratic participation gap</text>
    
    <!-- Techno-Solutionism -->
    <rect x="660" y="40" width="200" height="100" rx="8" class="contemporary"/>
    <text x="760" y="65" text-anchor="middle" class="thinker-name">TECHNO-</text>
    <text x="760" y="80" text-anchor="middle" class="thinker-name">SOLUTIONISM</text>
    <text x="670" y="100" class="concept">• Technology as panacea</text>
    <text x="670" y="115" class="concept">• Ignoring social context</text>
    <text x="670" y="130" class="concept">• Depoliticization</text>
  </g>

  <!-- dataimago Responses -->
  <g transform="translate(50, 480)">
    <text x="450" y="20" text-anchor="middle" class="section-title">dataimago'S CRITICAL AI RESPONSES</text>
    
    <!-- Democratic AI Governance -->
    <rect x="0" y="40" width="190" height="120" rx="8" class="dataimago-response"/>
    <text x="95" y="60" text-anchor="middle" class="thinker-name">DEMOCRATIC</text>
    <text x="95" y="75" text-anchor="middle" class="thinker-name">AI GOVERNANCE</text>
    <text x="10" y="95" class="concept">Inspired by: Habermas</text>
    <text x="10" y="110" class="concept">• Participatory design</text>
    <text x="10" y="125" class="concept">• Transparent algorithms</text>
    <text x="10" y="140" class="concept">• Community oversight</text>
    <text x="10" y="155" class="concept">• Democratic accountability</text>
    
    <!-- Anti-Domination Design -->
    <rect x="210" y="40" width="190" height="120" rx="8" class="dataimago-response"/>
    <text x="305" y="60" text-anchor="middle" class="thinker-name">ANTI-DOMINATION</text>
    <text x="305" y="75" text-anchor="middle" class="thinker-name">DESIGN</text>
    <text x="220" y="95" class="concept">Inspired by: Horkheimer/Adorno</text>
    <text x="220" y="110" class="concept">• Reflexive monitoring</text>
    <text x="220" y="125" class="concept">• Power analysis</text>
    <text x="220" y="140" class="concept">• Critical consciousness</text>
    <text x="220" y="155" class="concept">• Emancipatory metrics</text>
    
    <!-- Flow-Based Systems -->
    <rect x="420" y="40" width="190" height="120" rx="8" class="dataimago-response"/>
    <text x="515" y="60" text-anchor="middle" class="thinker-name">FLOW-BASED</text>
    <text x="515" y="75" text-anchor="middle" class="thinker-name">SYSTEMS</text>
    <text x="430" y="95" class="concept">Inspired by: Marcuse</text>
    <text x="430" y="110" class="concept">• Growth vs. control</text>
    <text x="430" y="125" class="concept">• Dynamic adaptation</text>
    <text x="430" y="140" class="concept">• Potential realization</text>
    <text x="430" y="155" class="concept">• Creative agency</text>
    
    <!-- Hermeneutic-Positivistic Synthesis -->
    <rect x="630" y="40" width="190" height="120" rx="8" class="dataimago-response"/>
    <text x="725" y="55" text-anchor="middle" class="thinker-name">HERMENEUTIC-</text>
    <text x="725" y="70" text-anchor="middle" class="thinker-name">POSITIVISTIC</text>
    <text x="725" y="85" text-anchor="middle" class="thinker-name">SYNTHESIS</text>
    <text x="640" y="105" class="concept">Inspired by: All Frankfurt School</text>
    <text x="640" y="120" class="concept">• Meaning + measurement</text>
    <text x="640" y="135" class="concept">• Context + data</text>
    <text x="640" y="150" class="concept">• Understanding + analysis</text>
  </g>

  <!-- Connection Lines -->
  <!-- From Frankfurt School to Problems -->
  <path d="M 190 240 L 150 280" class="influence"/>
  <path d="M 500 240 L 320 280" class="influence"/>
  <path d="M 810 240 L 540 280" class="influence"/>
  
  <!-- From Problems to Solutions -->
  <path d="M 100 380 L 95 480" class="connection"/>
  <path d="M 320 380 L 305 480" class="connection"/>
  <path d="M 540 380 L 515 480" class="connection"/>
  <path d="M 760 380 L 725 480" class="connection"/>

  <!-- Key Principles Box -->
  <rect x="50" y="650" width="900" height="100" rx="10" fill="#F0F0F0" stroke="#333" stroke-width="2"/>
  <text x="500" y="675" text-anchor="middle" class="section-title">CORE PRINCIPLES FOR CRITICAL AI</text>
  
  <text x="70" y="700" class="application">1. REFLEXIVITY: AI systems must monitor themselves for domination patterns</text>
  <text x="70" y="715" class="application">2. PARTICIPATION: Affected communities shape AI objectives and constraints</text>
  <text x="70" y="730" class="application">3. TRANSPARENCY: Algorithmic decisions must be explainable and challengeable</text>
  
  <text x="520" y="700" class="application">4. EMANCIPATION: Technology serves human flourishing, not control</text>
  <text x="520" y="715" class="application">5. DIALECTICAL: Embrace contradiction rather than false optimization</text>
  <text x="520" y="730" class="application">6. DEMOCRATIC: Power relations remain accountable to democratic review</text>

  <!-- Footer -->
  <text x="500" y="780" text-anchor="middle" class="description">
    "The task is not to match existing power, but to surpass it in purpose" — dataimago principle
  </text>
</svg>