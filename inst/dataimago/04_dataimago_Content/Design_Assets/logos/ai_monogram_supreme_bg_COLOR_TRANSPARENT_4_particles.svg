<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura { font-family: 'Futura','Futura PT',Arial,sans-serif; font-style: italic; font-weight: bold; }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
    </style>

    <!-- Clipping path: constrains entire shape to rounded rectangle -->
    <clipPath id="rounded-boundary">
      <rect width="480" height="480" rx="40" ry="40"/>
    </clipPath>

    <!-- Mask: white = keep, black = hole -->
    <mask id="ai-cutout" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="white"/>
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>

    <!-- Particle system background -->
    <pattern id="particle-flow" patternUnits="userSpaceOnUse" width="160" height="160">
      <!-- Large flowing particles -->
      <circle cx="20" cy="80" r="3" fill="#00aaff" opacity="0.8">
        <animate attributeName="cx" values="20;140;20" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;40;80" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.3;0.8" dur="8s" repeatCount="indefinite"/>
      </circle>
      
      <circle cx="140" cy="120" r="2.5" fill="#ff4466" opacity="0.7">
        <animate attributeName="cx" values="140;20;140" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;80;120" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.4;0.7" dur="10s" repeatCount="indefinite"/>
      </circle>
      
      <circle cx="80" cy="20" r="2" fill="#00ff77" opacity="0.6">
        <animate attributeName="cx" values="80;80;80" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="20;140;20" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="6s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Medium particles -->
      <circle cx="50" cy="50" r="1.5" fill="#ffaa00" opacity="0.5">
        <animate attributeName="cx" values="50;110;50" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="50;110;50" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1.5;3;1.5" dur="7s" repeatCount="indefinite"/>
      </circle>
      
      <circle cx="110" cy="30" r="1.8" fill="#aa00ff" opacity="0.6">
        <animate attributeName="cx" values="110;50;110" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="30;130;30" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="9s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Small sparkling particles -->
      <circle cx="30" cy="130" r="1" fill="#ffffff" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.1;0.9" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1;2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <circle cx="130" cy="60" r="0.8" fill="#ffff00" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="0.8;1.5;0.8" dur="3s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Connecting trails -->
      <line x1="20" y1="80" x2="80" y2="20" stroke="#00aaff" stroke-width="0.5" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
      </line>
      
      <line x1="80" y1="20" x2="140" y2="120" stroke="#ff4466" stroke-width="0.5" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
      </line>
    </pattern>
  </defs>

  <!-- All content clipped to rounded rectangle boundary -->
  <g clip-path="url(#rounded-boundary)">
    <!-- Animated background layer (shows through the cutout) -->
    <rect width="100%" height="100%" fill="url(#particle-flow)"/>

    <!-- White rounded rectangle with the 'ai' punched out -->
    <rect width="100%" height="100%" rx="40" ry="40" fill="white" mask="url(#ai-cutout)"/>
  </g>
</svg>
