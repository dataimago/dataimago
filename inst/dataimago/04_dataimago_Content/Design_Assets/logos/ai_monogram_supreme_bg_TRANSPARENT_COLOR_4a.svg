<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura { font-family: 'Futura','Futura PT',Arial,sans-serif; font-style: italic; font-weight: bold; }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
    </style>

    <!-- Clipping path: constrains entire shape to rounded rectangle -->
    <clipPath id="rounded-boundary">
      <rect width="480" height="480" rx="40" ry="40"/>
    </clipPath>

    <!-- Mask for outside area only (inverse of ai cutout) -->
    <mask id="outside-only" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="white"/>
      <!-- Black out the ai letters to create holes in the mask -->
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>

    <!-- Mask for inside cutout area only -->
    <mask id="inside-only" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="black"/>
      <!-- White ai letters to create visible areas -->
      <text x="105"   y="360" class="futura data"  fill="white">a</text>
      <text x="245.5" y="355" class="futura imago" fill="white">i</text>
    </mask>

    <!-- Fraser Spiral Illusion pattern for outside (clockwise rotation, original colors) -->
    <pattern id="fraser-spiral-bg-clockwise" patternUnits="userSpaceOnUse" width="480" height="480" viewBox="0 0 1679.806 1679.8059">
      <!-- Reference the external Fraser spiral SVG content -->
      <image href="Fraser-Spiral-Illusion.svg" width="1679.806" height="1679.8059" opacity="0.8">
        <!-- Clockwise rotation animation -->
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 839.903 839.903;360 839.903 839.903"
                          dur="60s" repeatCount="indefinite"/>
      </image>
    </pattern>

    <!-- Color-inverted Fraser Spiral for inside cutout -->
    <filter id="color-invert">
      <!-- Create a color transformation: white->black, red->cyan, blue->orange -->
      <feColorMatrix type="matrix" 
                     values="-1 0 0 1 0
                             0 -1 0 1 0  
                             0 0 -1 1 0
                             0 0 0 1 0"/>
    </filter>

    <!-- Fraser Spiral Illusion pattern for inside (counter-clockwise rotation, inverted colors) -->
    <pattern id="fraser-spiral-bg-counterclockwise-inverted" patternUnits="userSpaceOnUse" width="480" height="480" viewBox="0 0 1679.806 1679.8059">
      <!-- Reference the external Fraser spiral SVG content with color inversion -->
      <image href="Fraser-Spiral-Illusion.svg" width="1679.806" height="1679.8059" opacity="0.9" filter="url(#color-invert)">
        <!-- Counter-clockwise rotation animation -->
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 839.903 839.903;-360 839.903 839.903"
                          dur="60s" repeatCount="indefinite"/>
      </image>
    </pattern>

  </defs>

  <!-- All content clipped to rounded rectangle boundary -->
  <g clip-path="url(#rounded-boundary)">
    <!-- Base background -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Fraser Spiral background layer - clockwise rotation, original colors (outside cutout only) -->
    <rect width="100%" height="100%" fill="url(#fraser-spiral-bg-clockwise)" mask="url(#outside-only)"/>
    
    <!-- Fraser Spiral background layer - counter-clockwise rotation, inverted colors (inside cutout only) -->
    <rect width="100%" height="100%" fill="url(#fraser-spiral-bg-counterclockwise-inverted)" mask="url(#inside-only)"/>
  </g>
</svg>
