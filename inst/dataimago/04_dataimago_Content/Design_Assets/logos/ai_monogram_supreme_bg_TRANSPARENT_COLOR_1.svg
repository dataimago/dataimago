<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura { font-family: 'Futura','Futura PT',Arial,sans-serif; font-style: italic; font-weight: bold; }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
    </style>

    <!-- Clipping path: constrains entire shape to rounded rectangle -->
    <clipPath id="rounded-boundary">
      <rect width="480" height="480" rx="40" ry="40"/>
    </clipPath>

    <!-- Mask for outside area only (inverse of ai cutout) -->
    <mask id="outside-only" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="white"/>
      <!-- Black out the ai letters to create holes in the mask -->
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>

    <!-- Mask for inside cutout area only -->
    <mask id="inside-only" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="black"/>
      <!-- White ai letters to create visible areas -->
      <text x="105"   y="360" class="futura data"  fill="white">a</text>
      <text x="245.5" y="355" class="futura imago" fill="white">i</text>
    </mask>

    <!-- Animated geometric patterns -->
    <pattern id="geometric-bg" patternUnits="userSpaceOnUse" width="120" height="120" viewBox="0 0 120 120">
      <!-- Large rotating hexagon -->
      <polygon points="60,15 105,37.5 105,82.5 60,105 15,82.5 15,37.5" 
               fill="none" stroke="#0066ff" stroke-width="2" opacity="0.6">
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 60 60;360 60 60"
                          dur="8s" repeatCount="indefinite"/>
      </polygon>
      
      <!-- Medium circle -->
      <circle cx="60" cy="60" r="25" fill="none" stroke="#ff3366" stroke-width="1.5" opacity="0.5">
        <animate attributeName="r" values="25;35;25" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Small triangles -->
      <polygon points="30,30 40,15 50,30" fill="#00ff88" opacity="0.4">
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 40 25;-360 40 25"
                          dur="6s" repeatCount="indefinite"/>
      </polygon>
      
      <polygon points="70,90 80,75 90,90" fill="#ffaa00" opacity="0.4">
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 80 85;360 80 85"
                          dur="5s" repeatCount="indefinite"/>
      </polygon>
      
      <!-- Animated lines -->
      <line x1="0" y1="60" x2="120" y2="60" stroke="#8800ff" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </line>
      <line x1="60" y1="0" x2="60" y2="120" stroke="#ff8800" stroke-width="1" opacity="0.3">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
      </line>
    </pattern>
  </defs>

  <!-- All content clipped to rounded rectangle boundary -->
  <g clip-path="url(#rounded-boundary)">
    <!-- Base background -->
    <rect width="100%" height="100%" fill="transparent"/>

    <!-- Animated background layer (outside cutout only) -->
    <rect width="100%" height="100%" fill="url(#geometric-bg)" mask="url(#outside-only)"/>
    
    <!-- Solid white fill for cutout area -->
    <rect width="100%" height="100%" fill="white" mask="url(#inside-only)"/>
  </g>
</svg>