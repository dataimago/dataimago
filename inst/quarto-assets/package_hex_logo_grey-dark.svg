<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura {
        font-family: 'Futura', 'Arial', sans-serif;
        font-style: italic;
        font-weight: bold;
      }
      
      .monogram-a {
        font-size: 920px;
        fill: #83838f;
      }
      
      .monogram-i {
        font-size: 820px;
        fill: #83838f;
      }
      
      .hexagon {
        fill: none;
        stroke: #83838f;
        stroke-width: 25;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
    </style>
    

  </defs>

  <!-- Perfect equi-angular hexagon with equal sides and rounded corners -->
  <path class="hexagon" 
        d="M 600,50 
           L 1050,337.5 
           L 1050,862.5 
           L 600,1150 
           L 150,862.5 
           L 150,337.5 
           Z" 
        stroke-linejoin="round"/>

  <!-- AI Monogram - centered within the hexagon -->
  <!-- Letter "a" -->
  <text x="311.5" y="880" class="futura monogram-a">a</text>
  
  <!-- Letter "i" -->
  <text x="638" y="870" class="futura monogram-i">i</text>
</svg>
