<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Futura', sans-serif; font-style: italic; font-weight: bold; font-size: 28px; fill: #333; }
      .subtitle { font-family: 'Futura', sans-serif; font-style: italic; font-size: 16px; fill: #666; }
      .section-title { font-family: 'Futura', sans-serif; font-weight: bold; font-size: 14px; fill: #333; }
      .label { font-family: 'Futura', sans-serif; font-size: 12px; fill: #333; }
      .description { font-family: 'Futura', sans-serif; font-size: 10px; fill: #666; }
      .disciplinary { fill: #CC4125; stroke: #A0321C; stroke-width: 2; opacity: 0.8; }
      .flow-based { fill: #2E86AB; stroke: #1E5A78; stroke-width: 2; opacity: 0.9; }
      .arrow { fill: none; stroke: #333; stroke-width: 3; marker-end: url(#arrowhead); }
      .transformation-arrow { fill: none; stroke: #F18F01; stroke-width: 4; marker-end: url(#big-arrowhead); }
      .ai-element { fill: #A23B72; stroke: #7A2B55; stroke-width: 1; }
      .human-element { fill: #F18F01; stroke: #C07001; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="big-arrowhead" markerWidth="15" markerHeight="10" refX="14" refY="5" orient="auto">
      <polygon points="0 0, 15 5, 0 10" fill="#F18F01" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" class="title">From Disciplinary to Flow-Based Society</text>
  <text x="450" y="65" text-anchor="middle" class="subtitle">dataimago's Vision for Emancipatory Social Systems</text>

  <!-- Left Side: Disciplinary Society -->
  <text x="150" y="110" text-anchor="middle" class="section-title">DISCIPLINARY SOCIETY</text>
  <text x="150" y="130" text-anchor="middle" class="description">(Foucault's Analysis)</text>

  <!-- Disciplinary Institutions -->
  <rect x="50" y="150" width="200" height="80" rx="10" class="disciplinary"/>
  <text x="150" y="175" text-anchor="middle" class="label" fill="white">STANDARDIZATION</text>
  <text x="150" y="195" text-anchor="middle" class="description" fill="white">• Fixed curricula &amp; benchmarks</text>
  <text x="150" y="210" text-anchor="middle" class="description" fill="white">• One-size-fits-all metrics</text>
  <text x="150" y="225" text-anchor="middle" class="description" fill="white">• Retrospective punishment</text>

  <rect x="50" y="250" width="200" height="80" rx="10" class="disciplinary"/>
  <text x="150" y="275" text-anchor="middle" class="label" fill="white">SURVEILLANCE</text>
  <text x="150" y="295" text-anchor="middle" class="description" fill="white">• Constant monitoring</text>
  <text x="150" y="310" text-anchor="middle" class="description" fill="white">• Panopticon effects</text>
  <text x="150" y="325" text-anchor="middle" class="description" fill="white">• Behavioral control</text>

  <rect x="50" y="350" width="200" height="80" rx="10" class="disciplinary"/>
  <text x="150" y="375" text-anchor="middle" class="label" fill="white">NORMALIZATION</text>
  <text x="150" y="395" text-anchor="middle" class="description" fill="white">• Statistical averages as ideals</text>
  <text x="150" y="410" text-anchor="middle" class="description" fill="white">• Deviation as pathology</text>
  <text x="150" y="425" text-anchor="middle" class="description" fill="white">• Instrumental reason</text>

  <!-- Transformation Arrow -->
  <path d="M 270 300 Q 400 250 530 300" class="transformation-arrow"/>
  <text x="400" y="240" text-anchor="middle" class="section-title" fill="#F18F01">AI-MEDIATED</text>
  <text x="400" y="255" text-anchor="middle" class="section-title" fill="#F18F01">TRANSFORMATION</text>

  <!-- Right Side: Flow-Based Society -->
  <text x="750" y="110" text-anchor="middle" class="section-title">FLOW-BASED SOCIETY</text>
  <text x="750" y="130" text-anchor="middle" class="description">(dataimago's Vision)</text>

  <!-- Flow-Based Systems -->
  <rect x="650" y="150" width="200" height="80" rx="10" class="flow-based"/>
  <text x="750" y="175" text-anchor="middle" class="label" fill="white">PERSONALIZATION</text>
  <text x="750" y="195" text-anchor="middle" class="description" fill="white">• Adaptive pathways</text>
  <text x="750" y="210" text-anchor="middle" class="description" fill="white">• Individual growth trajectories</text>
  <text x="750" y="225" text-anchor="middle" class="description" fill="white">• Prospective development</text>

  <rect x="650" y="250" width="200" height="80" rx="10" class="flow-based"/>
  <text x="750" y="275" text-anchor="middle" class="label" fill="white">TRANSPARENCY</text>
  <text x="750" y="295" text-anchor="middle" class="description" fill="white">• Democratic participation</text>
  <text x="750" y="310" text-anchor="middle" class="description" fill="white">• Algorithmic accountability</text>
  <text x="750" y="325" text-anchor="middle" class="description" fill="white">• Agency enhancement</text>

  <rect x="650" y="350" width="200" height="80" rx="10" class="flow-based"/>
  <text x="750" y="375" text-anchor="middle" class="label" fill="white">EMANCIPATION</text>
  <text x="750" y="395" text-anchor="middle" class="description" fill="white">• Diverse expressions of flourishing</text>
  <text x="750" y="410" text-anchor="middle" class="description" fill="white">• Potential realization</text>
  <text x="750" y="425" text-anchor="middle" class="description" fill="white">• Critical consciousness</text>

  <!-- AI-Human Collaboration Section -->
  <text x="450" y="480" text-anchor="middle" class="section-title">AI-HUMAN COLLABORATION MODEL</text>
  
  <!-- AI Components -->
  <circle cx="350" cy="520" r="40" class="ai-element"/>
  <text x="350" y="510" text-anchor="middle" class="label" fill="white">AI</text>
  <text x="350" y="525" text-anchor="middle" class="description" fill="white">Pattern</text>
  <text x="350" y="535" text-anchor="middle" class="description" fill="white">Recognition</text>

  <circle cx="250" cy="580" r="40" class="ai-element"/>
  <text x="250" y="570" text-anchor="middle" class="label" fill="white">AI</text>
  <text x="250" y="585" text-anchor="middle" class="description" fill="white">Predictive</text>
  <text x="250" y="595" text-anchor="middle" class="description" fill="white">Modeling</text>

  <circle cx="450" cy="580" r="40" class="ai-element"/>
  <text x="450" y="570" text-anchor="middle" class="label" fill="white">AI</text>
  <text x="450" y="585" text-anchor="middle" class="description" fill="white">System</text>
  <text x="450" y="595" text-anchor="middle" class="description" fill="white">Optimization</text>

  <!-- Human Components -->
  <circle cx="550" cy="520" r="40" class="human-element"/>
  <text x="550" y="510" text-anchor="middle" class="label" fill="white">HUMAN</text>
  <text x="550" y="525" text-anchor="middle" class="description" fill="white">Meaning</text>
  <text x="550" y="535" text-anchor="middle" class="description" fill="white">Making</text>

  <circle cx="650" cy="580" r="40" class="human-element"/>
  <text x="650" y="570" text-anchor="middle" class="label" fill="white">HUMAN</text>
  <text x="650" y="585" text-anchor="middle" class="description" fill="white">Ethical</text>
  <text x="650" y="595" text-anchor="middle" class="description" fill="white">Judgment</text>

  <circle cx="350" cy="640" r="40" class="human-element"/>
  <text x="350" y="630" text-anchor="middle" class="label" fill="white">HUMAN</text>
  <text x="350" y="645" text-anchor="middle" class="description" fill="white">Creative</text>
  <text x="350" y="655" text-anchor="middle" class="description" fill="white">Agency</text>

  <!-- Collaboration Arrows -->
  <path d="M 390 520 L 510 520" class="arrow"/>
  <path d="M 510 520 L 390 520" class="arrow"/>
  <path d="M 290 580 L 410 580" class="arrow"/>
  <path d="M 610 580 L 490 580" class="arrow"/>
  <path d="M 390 640 L 610 600" class="arrow"/>

  <!-- Key Differences Table -->
  <text x="50" y="500" class="section-title">KEY DIFFERENCES:</text>
  
  <text x="50" y="525" class="label">GOAL:</text>
  <text x="120" y="525" class="description">Control → Growth</text>
  
  <text x="50" y="545" class="label">METHOD:</text>
  <text x="120" y="545" class="description">Punishment → Development</text>
  
  <text x="50" y="565" class="label">METRICS:</text>
  <text x="120" y="565" class="description">Static → Dynamic</text>
  
  <text x="50" y="585" class="label">AGENCY:</text>
  <text x="120" y="585" class="description">Constrained → Enhanced</text>
  
  <text x="50" y="605" class="label">POWER:</text>
  <text x="120" y="605" class="description">Concentrated → Distributed</text>

  <!-- Footer -->
  <text x="450" y="690" text-anchor="middle" class="description">
    "Control for good (emancipation) rather than control for domination" - dataimago principle
  </text>
</svg>