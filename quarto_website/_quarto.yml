project:
  type: website
  title: "dataimago: Ethical AI-Native Data Science"
  output-dir: ../docs
  render:
   - "*.qmd"      # Render all .qmd files by default
   - "!content/presentations/**"  # Exclude presentations directory
   - "content/documents/**"       # Include documents directory

execute:
  freeze: auto

# Extensions configuration
extensions:
  - dataimago/ai-native

# Define your package documentation  
references:
  - type: r
    title: "Function Reference"
    source: "../man"   # Path to your R package .Rd files (relative to quarto_website)

website:
  site-url: "https://dataimago.github.io/dataimago/"
  repo-url: "https://github.com/dataimago/dataimago"
  title: "dataimago: Ethical AI-Native Data Science Foundation Package"
  description: "An emancipatory AI-aligned performance management system built on flow-based analytics and critical theory principles"
  favicon: assets/img/ai_monogram_supreme_favicon.png
  repo-actions: [edit, issue]
  page-navigation: true
  
  navbar:
    title: "dataimago"
    logo: assets/img/ai_monogram_supreme_bg_BW.png
    logo-alt: "dataimago AI-Native Data Science"
    logo-href: "https://dataimago.github.io/dataimago/"
    title-href: "https://dataimago.github.io/dataimago/"
    search: false
    pinned: true
    foreground: "#7c7c7c"
    left:
      - href: index.qmd
        text: Home
      - href: api_reference.qmd
        text: API Reference
      - text: Foundation
        menu:
          - href: foundations/mission.qmd
            text: Mission & Vision
          - href: foundations/philosophy.qmd
            text: Philosophy
          - href: manifesto/critical_theory_manifesto.qmd
            text: Critical Theory Manifesto
    right:
      - icon: github
        href: "https://github.com/dataimago/dataimago"
        target: _blank

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Getting Started"
        contents:
          - index.qmd
          - api_reference.qmd
      - section: "Foundation"
        contents:
          - foundations/mission.qmd
          - foundations/philosophy.qmd
          - foundations/governance.qmd
      - section: "Manifesto"
        contents:
          - manifesto/critical_theory_manifesto.qmd
          - manifesto/superalignment_and_emancipation.qmd
          - manifesto/dataimago_vs_palantir.qmd

metadata:
  image: assets/img/ai_monogram_supreme_COLOR.png  # must be a valid URL or relative path
  open-graph: true
  twitter-card:
    image: assets/img/ai_monogram_supreme_COLOR.png
    card-style: summary_large_image

format:
  html:
    theme:
      light: [cosmo, assets/css/website-light.scss]
      dark: [cosmo, assets/css/website-dark.scss]
    css: 
      - assets/css/dataimago.scss
      - assets/css/styles.css
      - assets/css/documents.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    include-after: |
      <link href="https://fonts.googleapis.com/css?family=Josefin+Sans:400,600" rel="stylesheet" type="text/css">
      <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.8/dist/lenis.css">
      <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
      <script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>
      <script type="text/javascript" src="/assets/js/jquery.sticky-kit.min.js"></script>
      <script type="text/javascript" src="/assets/js/scroll.js"></script>
      <script type="text/javascript" src="/assets/js/logo-switch.js"></script>
      <script type="text/javascript" src="/assets/js/custom-anchors.js"></script>
      <script type="text/javascript" src="/assets/js/lenis-integration.js"></script>