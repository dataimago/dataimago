name: Deploy to Netlify

on:
  push:
    branches: [ main ]
    paths:
      - 'ui/www/**'
      - 'man/**'
      - 'R/**'
      - 'ui/**'
      - 'inst/dataimago/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Setup Node.js for Design System
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Package and Build Design System
        run: |
          R CMD INSTALL .
          Rscript -e "
          # Create UI workspace first
          result <- dataimago::create_ui_workspace()
          if (!result[['success']]) quit(status = 1)
          
          # Build design system
          result <- dataimago::build_design_system(verbose = TRUE)
          if (!result[['success']]) quit(status = 1)
          "

      - name: Generate API Documentation
        run: |
          Rscript -e "
          dataimago::create_quarto_documentation(
            package_path = '.',
            output_path = 'ui/www',
            include_foundation_links = TRUE
          )
          "

      - name: Render Quarto Website
        run: |
          cd ui/www
          quarto render --output-dir ../netlify-build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './netlify-build'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
