name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler

      - name: Lint R Code
        run: |
          Rscript -e "
          lints <- lintr::lint_package()
          if (length(lints) > 0) {
            print(lints)
            quit(status = 1)
          }
          "

      - name: Check Code Style
        run: |
          Rscript -e "
          changed <- styler::style_pkg(include_roxygen_examples = FALSE)
          if (any(changed\$changed)) {
            cat('Code style issues found. Run styler::style_pkg(include_roxygen_examples = FALSE) locally.\n')
            cat('Files that need styling:\n')
            print(changed[changed\$changed, 'file'])
            quit(status = 1)
          }
          "

  test-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install UI dependencies
        run: |
          cd ui
          pnpm install

      - name: Test Design System Build
        run: |
          R CMD INSTALL .
          Rscript -e "
          result <- dataimago::build_design_system(
            force_rebuild = TRUE,
            include_sri = TRUE,
            verbose = TRUE
          )
          if (!result[['success']]) {
            cat('Design system build failed:', paste(result[['errors']], collapse = '; '), '\n')
            quit(status = 1)
          }

          required_assets <- c(
            'ui/dist/dataimago.min.css',
            'inst/quarto-assets/dataimago.min.css',
            'inst/quarto-assets/tokens.css'
          )

          missing <- !file.exists(required_assets)
          if (any(missing)) {
            cat('Missing assets:', paste(required_assets[missing], collapse = ', '))
            quit(status = 1)
          }

          cat('All design system tests passed')
          "

  test-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || github.token }}

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Test Documentation Generation
        run: |
          R CMD INSTALL .
          Rscript -e "
          dataimago::create_quarto_documentation(
            package_path = '.',
            output_path = 'test-docs',
            include_foundation_links = TRUE
          )

          required_files <- c(
            'test-docs/api_reference.qmd',
            'test-docs/_quarto.yml'
          )

          missing <- !file.exists(required_files)
          if (any(missing)) {
            cat('Missing documentation files:', paste(required_files[missing], collapse = ', '))
            quit(status = 1)
          }

          cat('Documentation generation tests passed')
          "

      - name: Test Quarto Rendering
        run: |
          cd test-docs
          quarto render --to html

          if [ ! -f "_site/index.html" ]; then
            echo "Quarto rendering failed - no index.html generated"
            exit 1
          fi

          echo "Quarto rendering tests passed"
