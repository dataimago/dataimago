<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Futura', sans-serif; font-style: italic; font-weight: bold; font-size: 28px; fill: #333; }
      .concept-title { font-family: 'Futura', sans-serif; font-weight: bold; font-size: 16px; fill: #333; }
      .description { font-family: 'Futura', sans-serif; font-size: 12px; fill: #666; }
      .metaphor-label { font-family: 'Futura', sans-serif; font-size: 10px; fill: #333; }
      
      .hermeneutic { fill: #A23B72; stroke: #7A2B55; stroke-width: 2; }
      .positivistic { fill: #2E86AB; stroke: #1E5A78; stroke-width: 2; }
      .synthesis { fill: #F18F01; stroke: #C07001; stroke-width: 2; }
      .flow { fill: #C73E1D; stroke: #9A2E15; stroke-width: 2; }
      .emancipation { fill: #4CAF50; stroke: #388E3C; stroke-width: 2; }
      .domination { fill: #CC4125; stroke: #A0321C; stroke-width: 2; }
      
      .connection { fill: none; stroke: #F18F01; stroke-width: 3; }
      .flow-line { fill: none; stroke: #C73E1D; stroke-width: 2; stroke-dasharray: 5,5; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Core Concept Visual Metaphors</text>

  <!-- 1. Hermeneutic-Positivistic Synthesis -->
  <g transform="translate(100, 80)">
    <text x="150" y="20" text-anchor="middle" class="concept-title">HERMENEUTIC-POSITIVISTIC SYNTHESIS</text>
    
    <!-- Hermeneutic Side (Circle) -->
    <circle cx="60" cy="80" r="40" class="hermeneutic"/>
    <text x="60" y="70" text-anchor="middle" class="metaphor-label" fill="white">MEANING</text>
    <text x="60" y="85" text-anchor="middle" class="metaphor-label" fill="white">Interpretation</text>
    <text x="60" y="95" text-anchor="middle" class="metaphor-label" fill="white">Context</text>
    
    <!-- Positivistic Side (Square) -->
    <rect x="200" y="40" width="80" height="80" class="positivistic"/>
    <text x="240" y="70" text-anchor="middle" class="metaphor-label" fill="white">MEASUREMENT</text>
    <text x="240" y="85" text-anchor="middle" class="metaphor-label" fill="white">Data</text>
    <text x="240" y="95" text-anchor="middle" class="metaphor-label" fill="white">Analysis</text>
    
    <!-- Synthesis (Overlapping) -->
    <ellipse cx="150" cy="80" rx="70" ry="30" class="synthesis" fill-opacity="0.7"/>
    <text x="150" y="75" text-anchor="middle" class="metaphor-label">AI-MEDIATED</text>
    <text x="150" y="90" text-anchor="middle" class="metaphor-label">SYNTHESIS</text>
    
    <text x="150" y="140" text-anchor="middle" class="description">Understanding + Measurement = Emancipatory Intelligence</text>
  </g>

  <!-- 2. Flow vs Static Systems -->
  <g transform="translate(500, 80)">
    <text x="150" y="20" text-anchor="middle" class="concept-title">FLOW VS. STATIC SYSTEMS</text>
    
    <!-- Static System (Grid) -->
    <g>
      <rect x="20" y="40" width="20" height="20" class="domination"/>
      <rect x="40" y="40" width="20" height="20" class="domination"/>
      <rect x="60" y="40" width="20" height="20" class="domination"/>
      <rect x="20" y="60" width="20" height="20" class="domination"/>
      <rect x="40" y="60" width="20" height="20" class="domination"/>
      <rect x="60" y="60" width="20" height="20" class="domination"/>
      <rect x="20" y="80" width="20" height="20" class="domination"/>
      <rect x="40" y="80" width="20" height="20" class="domination"/>
      <rect x="60" y="80" width="20" height="20" class="domination"/>
      <text x="50" y="115" text-anchor="middle" class="metaphor-label">DISCIPLINARY</text>
      <text x="50" y="125" text-anchor="middle" class="metaphor-label">Fixed/Static</text>
    </g>
    
    <!-- Flow System (Rivers) -->
    <g>
      <path d="M 200 40 Q 220 60 240 50 Q 260 40 280 60 Q 300 80 320 70" stroke="#C73E1D" stroke-width="8" fill="none"/>
      <path d="M 200 60 Q 230 80 260 70 Q 290 60 320 80" stroke="#C73E1D" stroke-width="6" fill="none"/>
      <path d="M 200 80 Q 240 100 280 90 Q 310 80 320 90" stroke="#C73E1D" stroke-width="8" fill="none"/>
      <text x="260" y="115" text-anchor="middle" class="metaphor-label">FLOW-BASED</text>
      <text x="260" y="125" text-anchor="middle" class="metaphor-label">Dynamic/Adaptive</text>
    </g>
    
    <text x="150" y="140" text-anchor="middle" class="description">Movement + Growth vs. Control + Standardization</text>
  </g>

  <!-- 3. AI as Bridge -->
  <g transform="translate(900, 80)">
    <text x="125" y="20" text-anchor="middle" class="concept-title">AI AS BRIDGE</text>
    
    <!-- Human Side -->
    <circle cx="50" cy="80" r="30" class="emancipation"/>
    <text x="50" y="75" text-anchor="middle" class="metaphor-label" fill="white">HUMAN</text>
    <text x="50" y="90" text-anchor="middle" class="metaphor-label" fill="white">Agency</text>
    
    <!-- AI Bridge -->
    <rect x="90" y="65" width="70" height="30" class="synthesis"/>
    <text x="125" y="85" text-anchor="middle" class="metaphor-label">AI BRIDGE</text>
    
    <!-- Enhanced Human -->
    <circle cx="200" cy="80" r="35" class="emancipation"/>
    <text x="200" y="70" text-anchor="middle" class="metaphor-label" fill="white">ENHANCED</text>
    <text x="200" y="85" text-anchor="middle" class="metaphor-label" fill="white">HUMAN</text>
    <text x="200" y="95" text-anchor="middle" class="metaphor-label" fill="white">POTENTIAL</text>
    
    <text x="125" y="140" text-anchor="middle" class="description">AI Amplifies Rather Than Replaces Human Capabilities</text>
  </g>

  <!-- 4. Dialectical Thinking -->
  <g transform="translate(100, 300)">
    <text x="150" y="20" text-anchor="middle" class="concept-title">DIALECTICAL THINKING</text>
    
    <!-- Thesis -->
    <circle cx="60" cy="80" r="35" class="hermeneutic"/>
    <text x="60" y="75" text-anchor="middle" class="metaphor-label" fill="white">THESIS</text>
    <text x="60" y="90" text-anchor="middle" class="metaphor-label" fill="white">Idea A</text>
    
    <!-- Antithesis -->
    <circle cx="240" cy="80" r="35" class="positivistic"/>
    <text x="240" y="75" text-anchor="middle" class="metaphor-label" fill="white">ANTITHESIS</text>
    <text x="240" y="90" text-anchor="middle" class="metaphor-label" fill="white">Idea B</text>
    
    <!-- Synthesis -->
    <circle cx="150" cy="140" r="40" class="synthesis"/>
    <text x="150" y="130" text-anchor="middle" class="metaphor-label">SYNTHESIS</text>
    <text x="150" y="145" text-anchor="middle" class="metaphor-label">New Understanding</text>
    <text x="150" y="155" text-anchor="middle" class="metaphor-label">(Preserves Both)</text>
    
    <!-- Arrows -->
    <path d="M 95 80 L 115 140" stroke="#F18F01" stroke-width="3" marker-end="url(#arrowhead)"/>
    <path d="M 205 80 L 185 140" stroke="#F18F01" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <text x="150" y="200" text-anchor="middle" class="description">Productive Tension Creates New Possibilities</text>
  </g>

  <!-- 5. Emancipation vs Domination -->
  <g transform="translate(500, 300)">
    <text x="150" y="20" text-anchor="middle" class="concept-title">EMANCIPATION VS. DOMINATION</text>
    
    <!-- Domination (Pyramid) -->
    <polygon points="60,120 20,40 100,40" class="domination"/>
    <text x="60" y="70" text-anchor="middle" class="metaphor-label" fill="white">CONTROL</text>
    <text x="60" y="85" text-anchor="middle" class="metaphor-label" fill="white">Hierarchy</text>
    <text x="60" y="140" text-anchor="middle" class="metaphor-label">DOMINATION</text>
    
    <!-- Emancipation (Network) -->
    <g>
      <circle cx="200" cy="60" r="8" class="emancipation"/>
      <circle cx="240" cy="60" r="8" class="emancipation"/>
      <circle cx="280" cy="60" r="8" class="emancipation"/>
      <circle cx="220" cy="90" r="8" class="emancipation"/>
      <circle cx="260" cy="90" r="8" class="emancipation"/>
      <circle cx="200" cy="120" r="8" class="emancipation"/>
      <circle cx="240" cy="120" r="8" class="emancipation"/>
      <circle cx="280" cy="120" r="8" class="emancipation"/>
      
      <!-- Connections -->
      <line x1="200" y1="60" x2="240" y2="60" class="connection"/>
      <line x1="240" y1="60" x2="280" y2="60" class="connection"/>
      <line x1="200" y1="60" x2="220" y2="90" class="connection"/>
      <line x1="240" y1="60" x2="220" y2="90" class="connection"/>
      <line x1="240" y1="60" x2="260" y2="90" class="connection"/>
      <line x1="280" y1="60" x2="260" y2="90" class="connection"/>
      <line x1="220" y1="90" x2="200" y2="120" class="connection"/>
      <line x1="220" y1="90" x2="240" y2="120" class="connection"/>
      <line x1="260" y1="90" x2="240" y2="120" class="connection"/>
      <line x1="260" y1="90" x2="280" y2="120" class="connection"/>
      
      <text x="240" y="140" text-anchor="middle" class="metaphor-label">EMANCIPATION</text>
    </g>
    
    <text x="150" y="170" text-anchor="middle" class="description">Distributed Agency vs. Concentrated Control</text>
  </g>

  <!-- 6. Critical Consciousness -->
  <g transform="translate(900, 300)">
    <text x="100" y="20" text-anchor="middle" class="concept-title">CRITICAL CONSCIOUSNESS</text>
    
    <!-- Closed Eye (Unconscious) -->
    <ellipse cx="50" cy="70" rx="30" ry="15" class="domination"/>
    <line x1="25" y1="70" x2="75" y2="70" stroke="#A0321C" stroke-width="3"/>
    <text x="50" y="100" text-anchor="middle" class="metaphor-label">UNCONSCIOUS</text>
    
    <!-- Open Eye (Conscious) -->
    <ellipse cx="150" cy="70" rx="30" ry="15" class="emancipation"/>
    <circle cx="150" cy="70" r="8" fill="#388E3C"/>
    <circle cx="150" cy="70" r="4" fill="white"/>
    <text x="150" y="100" text-anchor="middle" class="metaphor-label">CRITICAL</text>
    <text x="150" y="110" text-anchor="middle" class="metaphor-label">CONSCIOUSNESS</text>
    
    <!-- Arrow -->
    <path d="M 80 70 L 120 70" stroke="#F18F01" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <text x="100" y="140" text-anchor="middle" class="description">Awakening to Power Relations</text>
  </g>

  <!-- 7. Flow States -->
  <g transform="translate(100, 520)">
    <text x="200" y="20" text-anchor="middle" class="concept-title">OPTIMAL EXPERIENCE (FLOW)</text>
    
    <!-- Challenge-Skill Balance -->
    <rect x="50" y="40" width="300" height="200" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Axes -->
    <line x1="50" y1="240" x2="350" y2="240" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="240" x2="50" y2="40" stroke="#333" stroke-width="2"/>
    
    <text x="200" y="260" text-anchor="middle" class="metaphor-label">SKILL LEVEL</text>
    <text x="30" y="140" text-anchor="middle" class="metaphor-label" transform="rotate(-90 30 140)">CHALLENGE</text>
    
    <!-- Flow Channel -->
    <polygon points="50,240 200,90 350,40 350,70 200,120 50,270" class="emancipation" fill-opacity="0.5"/>
    <text x="200" y="100" text-anchor="middle" class="metaphor-label">FLOW CHANNEL</text>
    <text x="200" y="115" text-anchor="middle" class="metaphor-label">(Optimal Learning)</text>
    
    <!-- Boredom Area -->
    <polygon points="50,240 200,90 50,90" class="domination" fill-opacity="0.3"/>
    <text x="100" y="170" text-anchor="middle" class="metaphor-label">BOREDOM</text>
    
    <!-- Anxiety Area -->
    <polygon points="200,90 350,40 200,40" class="domination" fill-opacity="0.3"/>
    <text x="275" y="70" text-anchor="middle" class="metaphor-label">ANXIETY</text>
    
    <text x="200" y="290" text-anchor="middle" class="description">dataimago Systems Maintain Optimal Challenge-Skill Balance</text>
  </g>

  <!-- 8. AI Alignment Spectrum -->
  <g transform="translate(500, 520)">
    <text x="200" y="20" text-anchor="middle" class="concept-title">AI ALIGNMENT SPECTRUM</text>
    
    <!-- Misaligned AI -->
    <rect x="50" y="60" width="80" height="60" class="domination"/>
    <text x="90" y="85" text-anchor="middle" class="metaphor-label" fill="white">MISALIGNED</text>
    <text x="90" y="100" text-anchor="middle" class="metaphor-label" fill="white">AI</text>
    <text x="90" y="140" text-anchor="middle" class="metaphor-label">Serves Power</text>
    
    <!-- Current AI -->
    <rect x="160" y="60" width="80" height="60" class="synthesis"/>
    <text x="200" y="85" text-anchor="middle" class="metaphor-label">CURRENT</text>
    <text x="200" y="100" text-anchor="middle" class="metaphor-label">AI</text>
    <text x="200" y="140" text-anchor="middle" class="metaphor-label">Mixed Results</text>
    
    <!-- Emancipatory AI -->
    <rect x="270" y="60" width="80" height="60" class="emancipation"/>
    <text x="310" y="80" text-anchor="middle" class="metaphor-label" fill="white">EMANCIPATORY</text>
    <text x="310" y="95" text-anchor="middle" class="metaphor-label" fill="white">AI</text>
    <text x="310" y="105" text-anchor="middle" class="metaphor-label" fill="white">(dataimago)</text>
    <text x="310" y="140" text-anchor="middle" class="metaphor-label">Serves Flourishing</text>
    
    <!-- Arrow -->
    <path d="M 50 180 L 350 180" stroke="#F18F01" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="200" y="200" text-anchor="middle" class="metaphor-label">ALIGNMENT PROGRESS</text>
    
    <text x="200" y="230" text-anchor="middle" class="description">Moving from Control-Oriented to Emancipation-Oriented AI</text>
  </g>

  <!-- Add arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Footer -->
  <text x="600" y="850" text-anchor="middle" class="description">
    Visual metaphors help translate complex philosophical concepts into intuitive understanding
  </text>
  <text x="600" y="870" text-anchor="middle" class="description">
    — dataimago Visual Framework System
  </text>
</svg>