<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura { font-family: 'Futura','Futura PT',Arial,sans-serif; font-style: italic; font-weight: bold; }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
    </style>

    <!-- Clipping path: constrains entire shape to rounded rectangle -->
    <clipPath id="rounded-boundary">
      <rect width="480" height="480" rx="40" ry="40"/>
    </clipPath>

    <!-- Mask: white = keep, black = hole -->
    <mask id="ai-cutout" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="white"/>
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>

    <!-- Constellation network background -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#16213e" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- All content clipped to rounded rectangle boundary -->
  <g clip-path="url(#rounded-boundary)">
    <!-- Deep space background -->
    <rect width="100%" height="100%" fill="url(#space-bg)"/>
    
    <!-- Constellation nodes (stars/vertices) -->
    <!-- Node 1 -->
    <circle cx="120" cy="150" r="2" fill="#00aaff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Node 2 -->
    <circle cx="300" cy="100" r="1.5" fill="#ff3366" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="1.5;2.5;1.5" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Node 3 -->
    <circle cx="380" cy="220" r="2.5" fill="#00ff77" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="r" values="2.5;4;2.5" dur="5s" repeatCount="indefinite" begin="2s"/>
    </circle>
    
    <!-- Node 4 -->
    <circle cx="200" cy="320" r="1.8" fill="#ffaa00" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1.8;3.2;1.8" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Node 5 -->
    <circle cx="80" cy="380" r="2.2" fill="#aa00ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="2.2;3.8;2.2" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    
    <!-- Node 6 -->
    <circle cx="350" cy="350" r="1.6" fill="#ff8800" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.2s" repeatCount="indefinite" begin="2.2s"/>
      <animate attributeName="r" values="1.6;2.8;1.6" dur="3.2s" repeatCount="indefinite" begin="2.2s"/>
    </circle>
    
    <!-- Additional smaller nodes -->
    <circle cx="240" cy="180" r="1.2" fill="#ffffff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="160" cy="280" r="1" fill="#00ffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.8s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    
    <!-- Connection lines (constellation edges) -->
    <!-- Primary connections -->
    <line x1="120" y1="150" x2="300" y2="100" stroke="#00aaff" stroke-width="0.8" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="6s" repeatCount="indefinite"/>
    </line>
    
    <line x1="300" y1="100" x2="380" y2="220" stroke="#ff3366" stroke-width="0.6" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="7s" repeatCount="indefinite" begin="1s"/>
    </line>
    
    <line x1="380" y1="220" x2="350" y2="350" stroke="#00ff77" stroke-width="0.7" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="5.5s" repeatCount="indefinite" begin="2s"/>
    </line>
    
    <line x1="350" y1="350" x2="200" y2="320" stroke="#ffaa00" stroke-width="0.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="8s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    
    <line x1="200" y1="320" x2="80" y2="380" stroke="#aa00ff" stroke-width="0.6" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.1;0.25" dur="6.5s" repeatCount="indefinite" begin="1.5s"/>
    </line>
    
    <line x1="80" y1="380" x2="120" y2="150" stroke="#ff8800" stroke-width="0.4" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="9s" repeatCount="indefinite" begin="2.5s"/>
    </line>
    
    <!-- Secondary connections -->
    <line x1="120" y1="150" x2="240" y2="180" stroke="#ffffff" stroke-width="0.3" opacity="0.2">
      <animate attributeName="opacity" values="0.2;0.05;0.2" dur="4.2s" repeatCount="indefinite"/>
    </line>
    
    <line x1="240" y1="180" x2="380" y2="220" stroke="#00ffff" stroke-width="0.3" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.05;0.15" dur="5.8s" repeatCount="indefinite" begin="1.8s"/>
    </line>
    
    <line x1="160" y1="280" x2="200" y2="320" stroke="#ffffff" stroke-width="0.25" opacity="0.18">
      <animate attributeName="opacity" values="0.18;0.05;0.18" dur="4.5s" repeatCount="indefinite" begin="0.8s"/>
    </line>
    
    <!-- Data flow particles along connections -->
    <circle cx="120" cy="150" r="0.8" fill="#00aaff" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath href="#connection-path-1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Hidden paths for motion -->
    <defs>
      <path id="connection-path-1" d="M120,150 L300,100 L380,220 L350,350 L200,320 L80,380 L120,150" fill="none"/>
    </defs>

    <!-- White rounded rectangle with the 'ai' punched out -->
    <rect width="100%" height="100%" rx="40" ry="40" fill="white" mask="url(#ai-cutout)"/>
  </g>
</svg>
