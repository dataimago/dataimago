<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura { font-family: 'Futura','Futura PT',Arial,sans-serif; font-style: italic; font-weight: bold; }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
    </style>

    <!-- Clipping path: constrains entire shape to rounded rectangle -->
    <clipPath id="rounded-boundary">
      <rect width="480" height="480" rx="40" ry="40"/>
    </clipPath>

    <!-- Mask: white = keep, black = hole -->
    <mask id="ai-cutout" maskUnits="userSpaceOnUse">
      <rect width="480" height="480" rx="40" ry="40" fill="white"/>
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>

    <!-- Ripple effect background -->
    <radialGradient id="ripple-base" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001122" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000044" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- All content clipped to rounded rectangle boundary -->
  <g clip-path="url(#rounded-boundary)">
    <!-- Base background -->
    <rect width="100%" height="100%" fill="url(#ripple-base)"/>
    
    <!-- Animated ripple waves -->
    <!-- Wave 1 - Primary -->
    <circle cx="240" cy="240" r="50" fill="none" stroke="#00aaff" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="50;300;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;0.5;2" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Wave 2 - Secondary (offset timing) -->
    <circle cx="240" cy="240" r="80" fill="none" stroke="#ff3366" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="80;350;80" dur="5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="stroke-width" values="1.5;0.3;1.5" dur="5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Wave 3 - Tertiary -->
    <circle cx="240" cy="240" r="30" fill="none" stroke="#00ff77" stroke-width="2.5" opacity="0.7">
      <animate attributeName="r" values="30;280;30" dur="3.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3.5s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="stroke-width" values="2.5;0.4;2.5" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
    
    <!-- Wave 4 - Quaternary -->
    <circle cx="240" cy="240" r="100" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="100;400;100" dur="6s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="6s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="stroke-width" values="1;0.2;1" dur="6s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Central pulsing core -->
    <circle cx="240" cy="240" r="8" fill="#ffffff" opacity="0.9">
      <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Secondary ripple centers (creating interference patterns) -->
    <circle cx="180" cy="180" r="20" fill="none" stroke="#aa00ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="20;150;20" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    
    <circle cx="300" cy="300" r="25" fill="none" stroke="#ff8800" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="25;180;25" dur="5.5s" repeatCount="indefinite" begin="2.5s"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5.5s" repeatCount="indefinite" begin="2.5s"/>
    </circle>

    <!-- White rounded rectangle with the 'ai' punched out -->
    <rect width="100%" height="100%" rx="40" ry="40" fill="white" mask="url(#ai-cutout)"/>
  </g>
</svg>
