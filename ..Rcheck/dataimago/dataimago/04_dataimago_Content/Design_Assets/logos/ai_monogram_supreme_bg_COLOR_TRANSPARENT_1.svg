<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .futura {
        font-family: 'Futura', 'Futura PT', Arial, sans-serif;
        font-style: italic;
        font-weight: bold;
      }
      .imago { font-size: 380px; }
      .data  { font-size: 400px; }
      .base-background   { fill: white; }
      .outline-background{ fill: green; }
    </style>

    <!-- Mask: white = visible (keep); black = transparent (hole) -->
    <mask id="ai-cutout" maskUnits="userSpaceOnUse">
      <!-- Keep the full rounded rect area -->
      <rect x="0" y="0" width="480" height="480" rx="40" ry="40" fill="white"/>
      <!-- Punch out the letters by painting them black in the mask -->
      <text x="105"   y="360" class="futura data"  fill="black">a</text>
      <text x="245.5" y="355" class="futura imago" fill="black">i</text>
    </mask>
  </defs>

  <!-- Base background (shows through holes) -->
  <rect class="base-background" width="100%" height="100%" rx="40" ry="40"/>

  <!-- Green rounded rectangle with the 'ai' cut out -->
  <rect class="outline-background" width="100%" height="100%" rx="40" ry="40" mask="url(#ai-cutout)"/>
</svg>